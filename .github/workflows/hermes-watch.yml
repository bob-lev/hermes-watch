name: Hermes watch

# Every 5 minutes (GitHub's minimum interval), offset by 2 minutes to
# avoid the top-of-the-hour queue. Times are UTC; the checker records
# Beijing time itself. Scheduled runs only fire from the default branch.
# GitHub may delay scheduled runs under load, and disables the schedule
# after 60 days without repository activity, so this is a best-effort
# 5-minute layer. The 30-minute browser recheck stays as the second layer.
on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hermes-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check Hermes links
        id: check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/hermes-watch/check.py \
            --state .github/hermes-watch/state.json \
            --old-code U8e1zmbc

      - name: Commit state if changed
        if: steps.check.outcome == 'success'
        run: |
          git config user.name "hermes-watch"
          git config user.email "hermes-watch@users.noreply.github.com"
          git add .github/hermes-watch/state.json
          if git diff --cached --quiet; then
            echo "state unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "chore: hermes watch state"
          for i in 1 2 3; do
            if git pull --rebase && git push; then
              break
            fi
            sleep 10
          done

      - name: Notify Telegram on change
        if: steps.check.outcome == 'success' && steps.check.outputs.changed == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HERMES_MESSAGE: ${{ steps.check.outputs.message }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not set, skipping notification"
            exit 0
          fi
          curl -sS --fail-with-body -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${HERMES_MESSAGE}"
